[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wellness-tourism"
version = "0.1.0"
description = "Reproducible two-stage tourism purchase classification"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
include = ["wellness_tourism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]